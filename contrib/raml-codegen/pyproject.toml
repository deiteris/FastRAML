[project]
name = "raml-codegen"
version = "0.1.0"
description = "Generate source code from a RAML 1.0 definition, through the fastraml effective tree"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["fastraml>=0.1,<0.2", "jinja2>=3.1", "typer>=0.26"]

[project.scripts]
raml-codegen = "raml_codegen.cli:app"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.6", "httpx>=0.27"]

[tool.uv.sources]
fastraml = { path = "../..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["raml_codegen"]
artifacts = [
    "raml_codegen/py.typed",
    "raml_codegen/targets/python/templates/*",
    "raml_codegen/targets/python/runtime/*",
]

[tool.ruff]
target-version = "py312"
line-length = 120
# The golden record is generated output with a `pyproject.toml` of its own, so
# ruff treats it as a separate project and writes a cache inside it. It is
# linted by `tests/test_golden.py`, under its own settings, from a copy.
exclude = ["tests/golden"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM", "C90", "D100", "D101", "D102", "D103", "D104", "D105", "D107",
    "D203", "D213", "D400", "D401", "D415", "E501", "EM101", "EM102",
    "TRY003", "CPY001", "ANN401",
    # Relative imports inside the package are its idiom, as in the sibling
    # distributions: `from ...reader import Tree` says where the reader is.
    "TID",
    # `UnreadableTree` is what the condition is called. `UnreadableTreeError`
    # reads worse at the `except`, which is the only place it is written.
    "N818",
]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
multiline-quotes = "double"

[tool.ruff.lint.per-file-ignores]
# Generated by `python -m fastraml.views.bindings python`. Its shape is the
# generator's decision, and the root gate is what holds it to one.
"raml_codegen/tree.py" = ["ALL"]
# The runtime is *copied into* a generated package rather than imported from
# here, so it is written for its destination: it imports `httpx`, which this
# project does not depend on, and names that only resolve once it is in place.
"raml_codegen/targets/python/runtime/*.py" = ["ALL"]
"tests/*.py" = [
    "S101", "ANN", "D", "INP001", "PLR2004", "PLC0415", "SLF001", "S603",
    "S607", "ARG", "S106", "DTZ",
]
"examples/*.py" = ["INP001", "T201", "S106", "SLF001"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
exclude = "raml_codegen/targets/python/runtime/"

[tool.pytest.ini_options]
testpaths = ["tests"]
