[project]
name = "raml-document"
version = "0.1.0"
description = "A typed model of a RAML 1.0 document, for anything that emits one"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

# Deliberately one dependency. Not a web framework, and not pyraml: this is the
# authoring side of RAML and a parser is on the other one, so an emitter can
# take this without taking either.
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
# `raml_document.from_pydantic` reads pydantic models directly. The document
# model itself needs none of it, so importing `raml_document` does not.
pydantic = ["pydantic>=2.7", "annotated-types>=0.6"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pydantic>=2.7",
    "annotated-types>=0.6",
    "mypy>=1.10",
    "ruff>=0.6",
    # The round-trip test: what this emits, pyraml must parse.
    "pyraml",
]

[tool.uv.sources]
pyraml = { path = "../..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["raml_document"]
# PEP 561: without this in the wheel the annotations are invisible to a
# consumer's type checker and every import from here reads as `Any`.
artifacts = ["raml_document/py.typed"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM",
    "C90",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D107",
    "D203",
    "D213",
    "D400",
    "D401",
    "D415",
    "E501",
    "EM101",
    "EM102",
    "TRY003",
    "CPY001",
    "ANN401",
]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
multiline-quotes = "double"

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101", "ANN", "D", "INP001", "PLR2004", "PLC0415", "ARG001", "TC003", "N806"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
# No third-party imports beyond yaml, so there is nothing to be lenient about.
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
