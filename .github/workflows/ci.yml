name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  FORCE_COLOR: '1'

# Action versions: `actions/*` publish a moving major tag, so `@v7` follows
# patches. `astral-sh/setup-uv` stopped doing that after v7 -- from v8 on it
# tags only exact releases -- so it is pinned to one and has to be bumped by
# hand.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      # `--all-extras` pulls the `serve` extra, which resolves to
      # `contrib/fastraml-viewer` as an editable path; its build hook vendors
      # `viewer/dist`, so the bundle has to exist before the sync.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Build the viewer bundle
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
        run: npm ci && npm run build
        working-directory: viewer
      - run: uv sync --all-extras --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy fastraml/

  test:
    strategy:
      fail-fast: false
      matrix:
        # Windows earns a place in the matrix: path and URI handling differ
        # materially, and the sandbox uses different OS primitives there.
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv sync --dev --python ${{ matrix.python }}
      - name: Enable symlink creation (Windows)
        # Without this the sandbox escape tests skip rather than run, and the
        # symlink vectors are the ones worth proving.
        if: runner.os == 'Windows'
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" `
            /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"
        shell: pwsh
      - run: uv run pytest -q -rs

  # The pure-Python YAML backend must stay working: libyaml is optional, and a
  # behaviour difference between the two would only surface here.
  #
  # The backend is forced by making the C extension unimportable, not by
  # rebuilding PyYAML. `--no-binary :all:` only forces a *source* build, and
  # that build still links libyaml wherever the headers are -- which is here, so
  # the job compiled for a minute and then asserted on `libyaml` and failed. The
  # plugin checks the backend itself, so this cannot go back to silently
  # exercising the wrong one.
  test-pure-python-yaml:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run pytest -q -p tests.pure_python_yaml

  # The optional extras. Every other job installs none of them, so without this
  # one their tests skip everywhere and the options are tested only by reading
  # them: `regex_engine="re2"` is what a server parsing untrusted RAML selects,
  # and `pyoxigraph` is what makes the graph's RDF output checkable by something
  # other than the code that wrote it (docs/16 section 5.1).
  test-extras:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      # As in `lint`: the `serve` extra installs `contrib/fastraml-viewer` as
      # an editable path, and its build hook fails without the bundle. This job
      # also runs the `serve` tests, so the bundle is what they test against.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Build the viewer bundle
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
        run: npm ci && npm run build
        working-directory: viewer
      - run: uv sync --all-extras --dev
      - run: uv run python -c "import re2, pyoxigraph, fastraml_viewer"
      - run: uv run pytest -q -rs

  # Linearity is a property of the parser, not of the runner, so it is a gate.
  # Absolute wall-clock is not asserted anywhere; see docs/14 section 5.
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv sync --dev
      - name: bench_large must stay linear in input size
        env:
          FASTRAML_BENCH: '1'
        run: uv run pytest tests/bench -q -rs

  # The distributions under `contrib/` are separate uv projects with their own
  # locks, so the root gate never sees them: without this their suites run only
  # when someone remembers. They consume `fastraml` as an editable path
  # dependency, which makes this the job that notices when a change to the model
  # breaks a consumer of it rather than a test of it.
  contrib:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dist: [raml-document, fastapi-raml, fastmcp-raml, fastraml-viewer, raml-mock, raml-codegen]
    defaults:
      run:
        working-directory: contrib/${{ matrix.dist }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      # `fastraml-viewer` vendors `viewer/dist` in its build hook, so the
      # bundle has to exist before `uv sync` installs the project -- without it
      # the hook fails the install rather than shipping an empty package.
      # `fastapi-raml` needs it too: `--all-extras` pulls its `viewer` extra,
      # which depends on `fastraml-viewer` as an editable path, so the same hook
      # runs during that project's install.
      - uses: actions/setup-node@v7
        if: matrix.dist == 'fastraml-viewer' || matrix.dist == 'fastapi-raml'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Build the viewer bundle
        if: matrix.dist == 'fastraml-viewer' || matrix.dist == 'fastapi-raml'
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
        run: npm ci && npm run build
        working-directory: viewer
      - run: uv sync --all-extras --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Type-check the package
        env:
          DIST: ${{ matrix.dist }}
        run: uv run mypy "${DIST//-/_}"
      - run: uv run pytest -q

  # `viewer/` is outside the Python gate and has its own. It renders
  # `fixtures/sample`, so it is also what notices when a change to the tree
  # projection leaves output that is well-formed and unrenderable.
  viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Install without fetching a browser
        # `npm run ci` needs no browser; only `shots` does, and screenshots are
        # for looking at rather than for diffing (viewer/README.md).
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
        run: npm ci
        working-directory: viewer
      - run: npm run ci
        working-directory: viewer

  tck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The fixtures are the `tests/tck/raml-tck` submodule. They used to be a
      # second checkout of `acronis/go-raml`, which fetched that project's
      # default branch -- and the three fixture corrections the ratchet is keyed
      # to live nowhere on it, so this job was measuring inputs no local run
      # used. The submodule pins one commit, so CI and a developer see the same
      # fixtures or the diff says so.
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv sync --dev
      - name: Run the TCK against the ratchet
        run: uv run pytest tests/tck -q
