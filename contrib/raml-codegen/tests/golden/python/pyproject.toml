[project]
name = 'bookstore-api'
version = '2'
description = 'Bookstore API — a client generated from its RAML 1.0 definition'
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ['bookstore_api']
artifacts = ['bookstore_api/py.typed']

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.12"
strict = true
