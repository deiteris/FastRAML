[project]
name = "fastraml"
dynamic = ["version"]
description = "A RAML 1.0 parser for Python"
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yury" }]
keywords = ["raml", "api", "parser", "openapi", "specification", "json-schema"]
# Only what CI proves. The matrix is 3.12 and 3.13 on Linux and Windows, so
# 3.14 is not claimed until it runs there.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup",
    "Typing :: Typed",
]

dependencies = [
    # YAML composition. libyaml (CSafeLoader) is used automatically when the
    # wheel provides it; the pure-Python composer is the fallback.
    "pyyaml>=6.0",
    # External JSON Schema types (RAML spec "Using XML and JSON Schemas").
    "jsonschema>=4.21",
    "referencing>=0.35",
    # The !singularize / !pluralize template actions. A port of the same
    # JavaScript library the reference implementation's Go port wraps, so the
    # two agree by construction rather than by a maintained override table.
    # See docs/08 § 5.
    "pluralizer>=2.0",
]

[project.optional-dependencies]
# A synchronous HTTP client for remote `!include`, and for `fastraml ... -r`.
# `HTTPLoader` duck-types `get(url)`, so a `requests.Session` already installed
# works just as well and this pins neither into the base dependencies. httpx
# because the CLI tries it first and because its `Client` is thread-safe, which
# `requests.Session` does not promise.
http = ["httpx>=0.27"]
# Linear-time regex engine for `pattern:` facets. See docs/01 § 4.2.
re2 = ["google-re2"]
# An RDF store for `fastraml query`. The graph itself needs nothing; only SPARQL
# does. See docs/16 § 3.1.
graph = ["pyoxigraph>=0.4"]
# The built viewer SPA, served by `fastraml serve`. Static assets and the code
# that serves them -- no dependencies of its own, and imported only inside the
# verb, the way `query` imports `pyoxigraph`. See docs/17 § 1.
serve = ["fastraml-viewer>=0.1,<0.2"]

[project.scripts]
fastraml = "fastraml.cli:main"

[project.urls]
Homepage = "https://github.com/deiteris/FastRAML"
Repository = "https://github.com/deiteris/FastRAML"
Issues = "https://github.com/deiteris/FastRAML/issues"
Documentation = "https://github.com/deiteris/FastRAML/blob/master/docs/README.md"

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "hypothesis",
    "ruff",
    "types-pyyaml",
    "ruamel-yaml>=0.18,<0.20",
]
# Not in `dev`: the editable install's build hook copies `viewer/dist`, which a
# fresh checkout does not have until `npm run build` has run in viewer/. A plain
# `uv sync` must therefore not need it. `uv sync --group viewer` after the
# bundle is built (or `uv run --group viewer pytest -q`) is what exercises
# `fastraml serve` locally.
viewer = ["fastraml-viewer"]

# The parent checkout, in place: developed against the working tree rather than
# a release, so a change to the bundle shows up here without a publish. The
# source never reaches the wheel -- a built `fastraml` declares
# `fastraml-viewer` in its `serve` extra and resolves it from PyPI.
[tool.uv.sources]
fastraml-viewer = { path = "contrib/fastraml-viewer", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# One source of truth. The literal lives in the module because importing the
# package is deliberately cheap and `importlib.metadata` at import time is not;
# hatchling reads it from there rather than the two drifting apart, which they
# already had -- the module said 0.0.1 while the distribution said 0.1.0.
[tool.hatch.version]
path = "fastraml/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["fastraml"]
# PEP 561: without this in the wheel the annotations are invisible to a
# consumer's type checker and every import from here reads as `Any`.
artifacts = ["fastraml/py.typed"]

# An allow-list, not an exclude-list, because the default is "everything the
# root .gitignore does not name" and that is wrong here in a way that is easy to
# miss: hatchling does not read *nested* .gitignore files. `viewer/node_modules`
# is ignored by `viewer/.gitignore`, so it is invisible to git and visible to
# the sdist -- 4913 files and 41 MB of it. `.hypothesis` is not ignored at all.
#
# Named directories also keep the sdist reproducible as the tree grows: a new
# top-level folder has to be added here to ship, rather than shipping by
# accident.
[tool.hatch.build.targets.sdist]
# `tests/tck/raml-tck` is a submodule of fixtures that are not ours to
# redistribute -- upstream is archived and states no licence --
# and it is 2.4 MB. `/tests` would otherwise sweep it in.
exclude = ["/tests/tck/raml-tck"]
include = [
    "/fastraml",
    "/tests",
    "/docs",
    "/fixtures",
    "/bench",
    "/skills",
    "/README.md",
    "/LICENSE",
    "/CLAUDE.md",
    "/pyproject.toml",
    "/uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "tck: RAML Test Compliance Kit fixtures (see docs/14-testing.md)",
    "conformance: differential tests against a YAML 1.2 oracle (see docs/03-yaml-and-io.md)",
]

# --- Tooling -----------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 120
# The design documents contain illustrative Python that is written for reading,
# not for running. Formatting it expands grouped field lists one per line and
# costs the documents their density.
#
# `contrib/` holds separate distributions, each with its own pyproject and its
# own gate, exactly as `viewer/` has its own `package.json` and `npm run check`.
# Linting them from here would apply this project's rules to a project that
# states its own, and would need their dependencies installed to do it.
#
# `fastraml/views/bindings/static/` holds the hand-written half of each binding
# (docs/16 § 7). Its style is the *contract's* rather than this project's:
# `TypeAlias` over `type` is load-bearing there for the PEP 563 reason
# `static/tree.pyi` gives, and it names types only the generated half declares.
# `contrib/raml-codegen` already exempts the same bytes as its generated
# `tree.py`; this is that exemption applied where they are written.
exclude = ["docs", "contrib", "fastraml/views/bindings/static"]

[tool.ruff.lint]
select = [
    "ALL", # include all the rules, including new ones
]
ignore = [
    #### modules
    "COM", # flake8-commas
    "C90", # mccabe complexity
    "DJ",  # django
    "EXE", # flake8-executable
    "T10", # debugger
    "TID", # flake8-tidy-imports

    #### specific rules
    "D100",   # ignore missing docs
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "D200",
    "D203",
    "D205",
    # D212 and D213 are mutually exclusive; one of the pair must be ignored.
    # This project puts the summary on the first line (D212's rule), which is
    # the opposite of the sibling packages' choice.
    "D213",
    "D400",
    "D401",
    "D415",
    "E402",   # false positives for local imports
    "E501",   # line too long
    # EM101/EM102: a diagnostic's message is a stable *key* that tests and log
    # grouping match on (docs/11-diagnostics.md § 6), and it is passed to
    # a factory (`node_error`, `RamlError.new`) rather than to an exception
    # constructor. Hoisting each one into a local named `message` would add a
    # line per diagnostic and hide the key from a reader of the raise.
    "EM101",
    "EM102",
    "TRY003", # external messages in exceptions are too verbose
    "TD002",
    "TD003",
    "FIX002", # too verbose descriptions of todos
    "PTH123",
    "ERA001",
    "CPY001", # this project does not use per-file copyright headers
    "ANN401", # *args: Any in context managers is standard Python
]

[tool.ruff.format]
# Match flake8-quotes below; without this the formatter rewrites to double
# quotes and then the linter objects to its output.
quote-style = "single"

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
# Docstrings use """; single here fights the formatter (ruff warns Q001).
multiline-quotes = "double"

[tool.ruff.lint.per-file-ignores]
# The loaders are the only module allowed to touch the filesystem directly, and
# they need low-level os primitives that the security rules flag by default.
"fastraml/loaders.py" = ["S603", "PTH", "PLR0911"]
# Both of these *are* command-line programs; stdout is their output channel.
"bench/__main__.py" = ["T201"]
"bench/ab.py" = ["T201"]
"fastraml/cli.py" = ["T201"]
# Tests import lazily to keep a module optional, and assert on private state.
"tests/*.py" = [
    "S101", "ARG", "FBT", "PLR2004", "S311", "ANN", "T201", "SLF001", "BLE001",
    "INP001", "S105", "S106", "PTH", "PLC0415", "D",
]

[tool.mypy]
# The hand-written Python binding declaration half is data, not runtime code: it
# is a `.pyi` stub, is never imported, and names types only the generated half
# declares.
exclude = "fastraml/views/bindings/static/"
ignore_missing_imports = true
disable_error_code = []
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
# The parser core is held to a stricter standard than the tests.
module = "fastraml.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unreachable = true
