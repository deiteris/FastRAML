[project]
name = "sphinxcontrib-fastraml"
version = "0.1.0"
description = "RAML 1.0 API references as native Sphinx content, read by fastraml"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
# `myst-parser` renders RAML descriptions, which are Markdown, into the same
# nodes a Sphinx page is made of -- so they are searched, cross-referenced and
# themed like every other paragraph on the site.
dependencies = ["fastraml>=0.1,<0.2", "sphinx>=8.1", "myst-parser>=4"]

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.6", "types-docutils"]

[tool.uv.sources]
fastraml = { path = "../..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `sphinxcontrib` is a namespace package shared with every other
# `sphinxcontrib-*` distribution, so it has no `__init__.py` of its own.
packages = ["sphinxcontrib"]
artifacts = ["sphinxcontrib/fastraml/py.typed"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM", "C90", "D100", "D101", "D102", "D103", "D104", "D105", "D107",
    "D203", "D213", "D400", "D401", "D415", "E501", "EM101", "EM102",
    "TRY003", "CPY001", "ANN401",
    # Relative imports inside the package are its idiom, as in the sibling
    # distributions.
    "TID",
]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
multiline-quotes = "double"

[tool.ruff.lint.isort]
# The parser, not this package: `sphinxcontrib/fastraml/` shares its last name.
known-third-party = ["fastraml"]

[tool.ruff.lint.per-file-ignores]
# `sphinxcontrib` is a namespace package: an `__init__.py` there would shadow
# every other `sphinxcontrib-*` distribution installed beside this one.
"sphinxcontrib/fastraml/*.py" = ["INP001"]
# Sphinx calls these with its own signatures, whatever each override uses.
"sphinxcontrib/fastraml/domain.py" = ["INP001", "PLR0913", "PLR0917", "ARG002"]
# Sphinx executes a `conf.py` as a script; it is never imported as a module.
"examples/*/conf.py" = ["INP001"]
"tests/*.py" = ["S101", "ANN", "D", "INP001", "PLR2004", "PLC0415", "SLF001", "ARG001"]

[tool.mypy]
python_version = "3.12"
# What `uv run mypy` checks with no argument, which is how CI calls it: the
# package is not named after the distribution, as the others' are.
files = ["sphinxcontrib/fastraml"]
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
# The namespace package has no `__init__.py`; without this mypy would take
# `fastraml` for the top-level package and clash with the parser's own.
explicit_package_bases = true
namespace_packages = true

[tool.pytest.ini_options]
testpaths = ["tests"]
