[project]
name = "raml-mock"
version = "0.1.0"
description = "Run an in-process mock HTTP server from a RAML 1.0 definition"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["fastraml>=0.1,<0.2", "aiohttp>=3.10", "simplejson>=3.19", "typer>=0.26"]

[project.scripts]
raml-mock = "raml_mock.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "mypy>=1.10", "ruff>=0.6", "hypothesis>=6"]

[tool.uv.sources]
fastraml = { path = "../..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["raml_mock"]
artifacts = ["raml_mock/py.typed"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM", "C90", "D100", "D101", "D102", "D103", "D104", "D105", "D107",
    "D203", "D213", "D400", "D401", "D415", "E501", "EM101", "EM102",
    "TRY003", "CPY001", "ANN401",
]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
multiline-quotes = "double"

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101", "ANN", "D", "INP001", "PLR2004", "PLC0415", "SLF001", "ARG001"]
"examples/*.py" = ["INP001", "T201"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
