[project]
name = 'bookstore-server'
version = '2'
description = 'Bookstore API — a server interface generated from its RAML 1.0 definition'
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ['bookstore_server']
artifacts = ['bookstore_server/py.typed']

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.12"
strict = true
